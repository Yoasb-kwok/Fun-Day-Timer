name: test

on:
  pull_request:
  push:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fun_day
          POSTGRES_PASSWORD: fun_day
          POSTGRES_DB: fun_day_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fun_day -d fun_day_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fun_day:fun_day@localhost:5432/fun_day_test
      SESSION_SECRET: ci-test-secret
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
